<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Menyajikan Data - Kelas V SD</title>
    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #357ABD;
            --secondary: #FF9F43;
            --success: #2ECC71;
            --danger: #FF5252;
            --bg-color: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-color: #2C3E50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#CBD5E1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 680px;
            padding: 28px;
            border: 4px solid #E2E8F0;
            position: relative;
            overflow: hidden;
        }

        /* Header & Progress Bar */
        .quiz-header {
            margin-bottom: 20px;
        }

        .quiz-title {
            text-align: center;
            color: var(--primary);
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 1px 1px 0px #D0E1F9;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            flex-grow: 1;
            height: 16px;
            background-color: #E2E8F0;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #CBD5E1;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF9F43, #FFC048);
            width: 10%;
            border-radius: 8px;
            transition: width 0.4s ease;
        }

        .progress-text {
            font-weight: bold;
            font-size: 14px;
            color: #64748B;
            min-width: 65px;
            text-align: right;
        }

        .score-badge {
            background-color: #FEF3C7;
            color: #D97706;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
            border: 2px solid #FDE68A;
            margin-top: 5px;
        }

        /* Question Box */
        .question-box {
            margin-top: 15px;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        /* Visual Containers (Table & Charts) */
        .visual-container {
            background-color: #F8FAFC;
            border: 2px dashed #CBD5E1;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
        }

        .data-table {
            width: 100%;
            max-width: 380px;
            border-collapse: collapse;
            margin: 5px 0;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .data-table th, .data-table td {
            border: 1px solid #CBD5E1;
            padding: 10px 14px;
            text-align: center;
            font-size: 15px;
        }

        .data-table th {
            background-color: #4A90E2;
            color: white;
            font-weight: bold;
        }

        .data-table tr:nth-child(even) {
            background-color: #F1F5F9;
        }

        /* Bar Charts Styles */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 170px;
            width: 100%;
            max-width: 420px;
            border-bottom: 3px solid #64748B;
            border-left: 3px solid #64748B;
            padding-top: 25px;
            padding-left: 10px;
            padding-right: 10px;
            margin-top: 10px;
            position: relative;
        }

        .bar-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
            width: 22%;
        }

        .bar-pair-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
            width: 28%;
        }

        .bars-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            width: 100%;
            justify-content: center;
            height: 100%;
        }

        .bar {
            width: 100%;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            transition: height 0.5s ease;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 2px;
            color: white;
            font-weight: bold;
            font-size: 11px;
        }

        /* Q6 Bars */
        .bar-36 { height: 75%; background-color: #4A90E2; }
        .bar-37 { height: 100%; background-color: #2ECC71; }
        .bar-38 { height: 37.5%; background-color: #FF5252; }
        .bar-39 { height: 62.5%; background-color: #FF9F43; }

        /* Q9 Double Bars */
        .bar-rani { background-color: #EC4899; width: 18px; }
        .bar-dika { background-color: #3B82F6; width: 18px; }

        /* Q10 Bars */
        .bar-sepak { height: 100%; background-color: #10B981; }
        .bar-bulu { height: 75%; background-color: #F59E0B; }
        .bar-basket { height: 50%; background-color: #8B5CF6; }
        .bar-renang { height: 25%; background-color: #06B6D4; }

        .bar-label {
            margin-top: 6px;
            font-weight: bold;
            font-size: 13px;
            color: #475569;
            text-align: center;
        }

        .chart-title {
            font-size: 15px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 6px;
            text-align: center;
        }

        .chart-legend {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 13px;
            font-weight: bold;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        /* Options Grid */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #FFFFFF;
            border: 2px solid #E2E8F0;
            border-radius: 14px;
            padding: 12px 18px;
            text-align: left;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            box-shadow: 0 3px 0 #E2E8F0;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--primary);
            background-color: #F0F7FF;
            transform: translateY(-2px);
            box-shadow: 0 5px 0 #CBD5E1;
        }

        .option-btn:active:not([disabled]) {
            transform: translateY(0);
            box-shadow: 0 2px 0 #CBD5E1;
        }

        .option-prefix {
            background-color: #F1F5F9;
            color: #64748B;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* Answer Feedback Styling */
        .option-btn.correct {
            background-color: #DCFCE7 !important;
            border-color: var(--success) !important;
            color: #166534 !important;
            box-shadow: 0 3px 0 #86EFAC !important;
        }

        .option-btn.correct .option-prefix {
            background-color: var(--success);
            color: white;
        }

        .option-btn.incorrect {
            background-color: #FEE2E2 !important;
            border-color: var(--danger) !important;
            color: #991B1B !important;
            box-shadow: 0 3px 0 #FCA5A5 !important;
        }

        .option-btn.incorrect .option-prefix {
            background-color: var(--danger);
            color: white;
        }

        .option-btn[disabled] {
            cursor: default;
        }

        /* Explanation Box */
        .explanation-box {
            background-color: #F8FAFC;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
            border-left: 6px solid var(--primary);
            animation: fadeIn 0.3s ease-in-out;
        }

        .explanation-box.correct-bg {
            border-left-color: var(--success);
            background-color: #F0FDF4;
        }

        .explanation-box.incorrect-bg {
            border-left-color: var(--danger);
            background-color: #FEF2F2;
        }

        .feedback-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .feedback-title.correct-text { color: var(--success); }
        .feedback-title.incorrect-text { color: var(--danger); }

        .explanation-text {
            font-size: 14px;
            color: #334155;
            line-height: 1.5;
        }

        /* Action Buttons */
        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 0 var(--primary-dark);
            transition: all 0.2s ease;
            display: none;
        }

        .next-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1E40AF;
        }

        .next-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 0 #1E40AF;
        }

        /* Result Screen */
        .result-screen {
            text-align: center;
            display: none;
            padding: 10px 0;
            animation: fadeIn 0.5s ease-in-out;
        }

        .result-icon {
            font-size: 64px;
            margin-bottom: 10px;
        }

        .result-title {
            font-size: 26px;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF9F43, #FFC048);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            box-shadow: 0 8px 20px rgba(255, 159, 67, 0.4);
            border: 4px solid #FFFFFF;
        }

        .score-number {
            font-size: 42px;
            font-weight: bold;
            line-height: 1;
        }

        .score-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .result-message {
            font-size: 18px;
            color: var(--text-color);
            margin-bottom: 25px;
            line-height: 1.6;
            background-color: #F1F5F9;
            padding: 16px;
            border-radius: 16px;
            font-weight: 600;
        }

        .restart-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #E67E22;
            transition: all 0.2s ease;
        }

        .restart-btn:hover {
            background-color: #E67E22;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #D35400;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Quiz Screen -->
    <div id="quiz-screen">
        <div class="quiz-header">
            <div class="quiz-title">📊 Kuis Menyajikan Data</div>
            <div class="progress-container">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
                <div class="progress-text" id="progress-text">Soal 1/10</div>
            </div>
            <div class="score-badge">Skor Saat Ini: <span id="current-score">0</span></div>
        </div>

        <div class="question-box">
            <div class="question-text" id="question-text"></div>
            
            <div id="visual-container" class="visual-container" style="display: none;">
                <!-- Tables or Diagrams injected here dynamically -->
            </div>

            <div class="options-grid" id="options-container">
                <!-- Options injected here -->
            </div>
        </div>

        <div class="explanation-box" id="explanation-box">
            <div class="feedback-title" id="feedback-title"></div>
            <div class="explanation-text" id="explanation-text"></div>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Lanjut ke Soal Berikutnya ➔</button>
    </div>

    <!-- Result Screen -->
    <div class="result-screen" id="result-screen">
        <div class="result-icon" id="result-icon">🎉</div>
        <div class="result-title">Kuis Selesai!</div>
        <div class="score-circle">
            <div class="score-number" id="final-score">0</div>
            <div class="score-label">Skor Akhir</div>
        </div>
        <div class="result-message" id="result-message"></div>
        <button class="restart-btn" onclick="restartQuiz()">🔄 Ulangi Kuis</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "Tabel yang menunjukkan nilai atau kategori data beserta banyaknya data yang muncul disebut.",
            options: ["Tabel gambar", "Tabel ukuran", "Tabel frekuensi", "Tabel nama"],
            correct: 2,
            explanation: "Tabel frekuensi adalah tabel yang menyajikan kategori data beserta jumlah atau banyaknya data (frekuensi) yang muncul."
        },
        {
            question: "Data warna kesukaan 8 siswa adalah Merah, Biru, Merah, Hijau, Biru, Merah, Kuning, Biru. Berapa frekuensi warna Biru.",
            options: ["2 siswa", "3 siswa", "4 siswa", "5 siswa"],
            correct: 1,
            explanation: "Jika kita hitung jumlah kata 'Biru' pada data (Merah, <b>Biru</b>, Merah, Hijau, <b>Biru</b>, Merah, Kuning, <b>Biru</b>), warna Biru muncul sebanyak 3 kali."
        },
        {
            question: "Dalam sebuah piktogram, 1 simbol bintang mewakili 2 siswa. Jika terdapat 5 simbol bintang, berapa siswa yang diwakili.",
            options: ["10 siswa", "7 siswa", "5 siswa", "2 siswa"],
            correct: 0,
            explanation: "Banyak siswa = jumlah simbol × nilai per simbol = 5 bintang × 2 siswa = 10 siswa."
        },
        {
            question: "Sebelum menghitung jumlah data pada piktogram, hal yang paling penting untuk diperhatikan adalah.",
            options: ["Ukuran gambar", "Warna halaman", "Nama pembuat", "Keterangan simbol"],
            correct: 3,
            explanation: "Keterangan simbol sangat penting karena memberitahu kita berapa nilai atau jumlah data yang diwakili oleh satu gambar/simbol."
        },
        {
            question: "Perhatikan tabel berikut: Buah yang paling banyak disukai adalah.",
            visualType: "table_q5",
            options: ["Mangga", "Pisang", "Apel", "Jeruk"],
            correct: 0,
            explanation: "Berdasarkan tabel di atas, Mangga memiliki frekuensi tertinggi yaitu 8 siswa, sehingga Mangga adalah buah yang paling banyak disukai."
        },
        {
            question: "Tampilkan gambar diagram batang sederhana tentang ukuran sepatu siswa dengan empat kategori ukuran, salah satu batangnya dibuat paling pendek. Pertanyaannya, pada diagram batang tersebut, ukuran sepatu apa yang dimiliki siswa paling sedikit.",
            visualType: "chart_q6",
            options: ["36", "37", "38", "39"],
            correct: 2,
            explanation: "Pada diagram batang di atas, batang untuk ukuran sepatu 38 adalah yang paling pendek (3 siswa), menandakan jumlah siswanya paling sedikit."
        },
        {
            question: "Bagian diagram batang vertikal yang menunjukkan nilai atau jumlah data disebut.",
            visualType: "none",
            options: ["Batang", "Judul", "Sumbu tegak", "Kategori"],
            correct: 2,
            explanation: "Sumbu tegak (sumbu vertikal) pada diagram batang vertikal berfungsi menunjukkan angka yang menyatakan nilai atau jumlah/frekuensi data."
        },
        {
            question: "Diagram batang yang batangnya berdiri dari bawah ke atas disebut diagram batang.",
            options: ["Vertikal", "Horizontal", "Frekuensi", "Ganda"],
            correct: 0,
            explanation: "Diagram batang yang batangnya tegak lurus berdiri dari bawah ke atas disebut diagram batang vertikal."
        },
        {
            question: "Data jumlah buku yang dibaca Rani dan Dika, Januari Rani 4 Dika 3, Februari Rani 6 Dika 5, Maret Rani 5 Dika 7. Pada bulan Maret, siapa yang membaca lebih banyak dan berapa selisihnya.",
            visualType: "chart_q9",
            options: ["Rani selisih 3 buku", "Dika selisih 3 buku", "Rani selisih 2 buku", "Dika selisih 2 buku"],
            correct: 3,
            explanation: "Berdasarkan diagram batang di atas, pada bulan Maret: Dika = 7 buku, Rani = 5 buku. Dika membaca lebih banyak dengan selisih = 7 - 5 = 2 buku."
        },
        {
            question: "Data jumlah siswa yang memilih olahraga, Sepak bola 8, Bulu tangkis 6, Basket 4, Renang 2. Pernyataan yang benar adalah.",
            visualType: "chart_q10",
            options: [
                "Renang lebih banyak dari Sepak bola", 
                "Sepak bola lebih banyak dari Bulu tangkis", 
                "Basket paling banyak dipilih", 
                "Bulu tangkis dan Renang jumlahnya sama"
            ],
            correct: 1,
            explanation: "Berdasarkan diagram batang di atas, pernyataan 'Sepak bola lebih banyak dari Bulu tangkis' adalah benar karena Sepak bola (8 siswa) > Bulu tangkis (6 siswa)."
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
        answered = false;
        const q = questions[currentQuestionIndex];

        // Update progress bar & text
        const progressPercent = ((currentQuestionIndex + 1) / questions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progressPercent}%`;
        document.getElementById('progress-text').innerText = `Soal ${currentQuestionIndex + 1}/${questions.length}`;

        // Question text
        document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${q.question}`;

        // Render Visuals
        const visualContainer = document.getElementById('visual-container');
        if (q.visualType === 'table_q5') {
            visualContainer.style.display = 'flex';
            visualContainer.innerHTML = `
                <div class="chart-title">Tabel Buah Kesukaan Siswa</div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Jenis Buah</th>
                            <th>Jumlah Siswa</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>Apel</td><td>4 siswa</td></tr>
                        <tr><td>Jeruk</td><td>6 siswa</td></tr>
                        <tr><td>Mangga</td><td>8 siswa</td></tr>
                        <tr><td>Pisang</td><td>2 siswa</td></tr>
                    </tbody>
                </table>
            `;
        } else if (q.visualType === 'chart_q6') {
            visualContainer.style.display = 'flex';
            visualContainer.innerHTML = `
                <div class="chart-title">Diagram Batang Ukuran Sepatu Siswa</div>
                <div class="bar-chart">
                    <div class="bar-group">
                        <div class="bar bar-36">6</div>
                        <div class="bar-label">Uk. 36</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar bar-37">8</div>
                        <div class="bar-label">Uk. 37</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar bar-38">3</div>
                        <div class="bar-label">Uk. 38</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar bar-39">5</div>
                        <div class="bar-label">Uk. 39</div>
                    </div>
                </div>
            `;
        } else if (q.visualType === 'chart_q9') {
            visualContainer.style.display = 'flex';
            visualContainer.innerHTML = `
                <div class="chart-title">Diagram Batang Jumlah Buku yang Dibaca</div>
                <div class="bar-chart">
                    <div class="bar-pair-group">
                        <div class="bars-wrapper">
                            <div class="bar bar-rani" style="height: 57%;">4</div>
                            <div class="bar bar-dika" style="height: 43%;">3</div>
                        </div>
                        <div class="bar-label">Januari</div>
                    </div>
                    <div class="bar-pair-group">
                        <div class="bars-wrapper">
                            <div class="bar bar-rani" style="height: 85%;">6</div>
                            <div class="bar bar-dika" style="height: 71%;">5</div>
                        </div>
                        <div class="bar-label">Februari</div>
                    </div>
                    <div class="bar-pair-group">
                        <div class="bars-wrapper">
                            <div class="bar bar-rani" style="height: 71%;">5</div>
                            <div class="bar bar-dika" style="height: 100%;">7</div>
                        </div>
                        <div class="bar-label">Maret</div>
                    </div>
                </div>
                <div class="chart-legend">
                    <div class="legend-item"><div class="legend-color" style="background-color: #EC4899;"></div> Rani</div>
                    <div class="legend-item"><div class="legend-color" style="background-color: #3B82F6;"></div> Dika</div>
                </div>
            `;
        } else if (q.visualType === 'chart_q10') {
            visualContainer.style.display = 'flex';
            visualContainer.innerHTML = `
                <div class="chart-title">Diagram Batang Olahraga Pilihan Siswa</div>
                <div class="bar-chart">
                    <div class="bar-group">
                        <div class="bar bar-sepak">8</div>
                        <div class="bar-label">Sepak Bola</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar bar-bulu">6</div>
                        <div class="bar-label">Bulu Tangkis</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar bar-basket">4</div>
                        <div class="bar-label">Basket</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar bar-renang">2</div>
                        <div class="bar-label">Renang</div>
                    </div>
                </div>
            `;
        } else {
            visualContainer.style.display = 'none';
            visualContainer.innerHTML = '';
        }

        // Render options
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        const prefixes = ['a', 'b', 'c', 'd'];

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span> <span>${opt}</span>`;
            btn.onclick = () => selectOption(idx);
            optionsContainer.appendChild(btn);
        });

        // Hide explanation & next button
        document.getElementById('explanation-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }

    function selectOption(selectedIndex) {
        if (answered) return;
        answered = true;

        const q = questions[currentQuestionIndex];
        const optionButtons = document.querySelectorAll('.option-btn');
        const explanationBox = document.getElementById('explanation-box');
        const feedbackTitle = document.getElementById('feedback-title');
        const explanationText = document.getElementById('explanation-text');

        // Disable all options
        optionButtons.forEach(btn => btn.disabled = true);

        if (selectedIndex === q.correct) {
            score += 10;
            document.getElementById('current-score').innerText = score;
            optionButtons[selectedIndex].classList.add('correct');
            
            feedbackTitle.className = 'feedback-title correct-text';
            feedbackTitle.innerHTML = '✅ Jawaban Kamu Benar!';
            explanationBox.className = 'explanation-box correct-bg';
        } else {
            optionButtons[selectedIndex].classList.add('incorrect');
            optionButtons[q.correct].classList.add('correct');
            
            feedbackTitle.className = 'feedback-title incorrect-text';
            feedbackTitle.innerHTML = '❌ Jawaban Kamu Kurang Tepat';
            explanationBox.className = 'explanation-box incorrect-bg';
        }

        explanationText.innerHTML = q.explanation;
        explanationBox.style.display = 'block';

        // Show Next button
        const nextBtn = document.getElementById('next-btn');
        if (currentQuestionIndex === questions.length - 1) {
            nextBtn.innerText = 'Lihat Hasil Akhir 🏆';
        } else {
            nextBtn.innerText = 'Lanjut ke Soal Berikutnya ➔';
        }
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        document.getElementById('final-score').innerText = score;

        const correctCount = score / 10;
        let icon = '🎉';
        let message = '';

        if (correctCount === 10) {
            icon = '🏆';
            message = 'Luar Biasa Perfect! Kamu menjawab 10 dari 10 soal dengan benar! Kamu sudah sangat menguasai materi menyajikan data ini. Pertahankan prestasimu!';
        } else if (correctCount >= 8) {
            icon = '🌟';
            message = `Hebat Sekali! Kamu berhasil menjawab ${correctCount} dari 10 soal dengan benar. Hasil yang sangat bagus, sedikit lagi mencapai nilai sempurna!`;
        } else if (correctCount >= 6) {
            icon = '👍';
            message = `Bagus! Kamu menjawab ${correctCount} dari 10 soal dengan benar. Kamu sudah cukup memahami materi, teruslah berlatih agar makin hebat!`;
        } else {
            icon = '💪';
            message = `Tetap Semangat! Kamu menjawab ${correctCount} dari 10 soal dengan benar. Jangan berkecil hati, ayo pelajari lagi materinya dan coba kuis ini sekali lagi!`;
        }

        document.getElementById('result-icon').innerText = icon;
        document.getElementById('result-message').innerText = message;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('current-score').innerText = score;
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    // Start Quiz
    loadQuestion();
</script>

</body>
</html>
